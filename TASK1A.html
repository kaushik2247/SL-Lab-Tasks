<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: "Times New Roman", serif;
            background-color: white;
            text-align: center;
        }

        /* Header */
        .header {
            background-color: rgb(19, 23, 19);
            color: white;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #ddd;
        }

        /* Main content */
        .container {
            padding-top: 16px;
        }

        /* Profile picture */
        .profile-img {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid black;
        }

        h2 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
        }

        .role {
            font-weight: bold;
        }

        /* Skills */
        .skills {
            margin-top: 15px;
        }

        .skill {
            display: inline-block;
            background-color: #0aaa18;
            color:white;
            padding: 7px 16px;
            margin: 4px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Contact */
        .contact {
            margin-top: 25px;
        }

        .contact p {
            margin: 12px;
        }

        a {
            color: black;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        My Portfolio
    </div>

    <!-- Main Content -->
    <div class="container">

        <!-- Profile -->
        <img src="Kaushik Photo.jpg" alt="Kaushik" class="profile-img">

        <h2>KAUSHIK S</h2>

        <p class="role">
            Computer Science Student
        </p>

        <!-- About -->
        <h3>About Me</h3>

        <p>
            Welcome to my Portfolio. I am a Computer Science student
            interested in coding.
        </p>

        <!-- Skills -->
        <h3>Skills</h3>

        <div class="skills">
            <span class="skill">C</span>
            <span class="skill">C++</span>
            <span class="skill">Python</span>
            
        </div>

        <!-- Contact -->
        <div class="contact">

            <h3>Contact me</h3>

            <p>
                Email:
                <a href="mailto:your-email@gmail.com">
                   kaushik2247@gmail.com
                </a>
            </p>

        </div>

    </div>

</body>
</html>
